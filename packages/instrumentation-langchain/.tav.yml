langchain:
  node: '>=20'
  versions:
    include: '>=1.0.0 <2'
    mode: max-5
  commands: npm test

'@langchain/core':
  node: '>=20'
  versions:
    include: '>=1.0.0 <2'
    mode: max-5
  commands: node test/fixtures/scenario.cjs
  env: LANGCHAIN_TEST_CORE_ONLY=true

'@langchain/classic':
  node: '>=20'
  versions:
    include: '>=1.0.0 <2'
    mode: max-5
  commands: npm test

'@langchain/langgraph':
  node: '>=20'
  versions:
    include: '>=1.0.0 <2'
    mode: max-5
  commands: npm test
