'@langchain/core':
  node: '>=20'
  # Keep companion SDKs compatible with early Core releases.
  peerDependencies:
    - langchain@1.0.1
    - '@langchain/langgraph@1.0.0'
  versions:
    include: '>=1.0.0 <2'
    mode: max-5
  # Graphs require their own compatible Core peer and are tested separately.
  commands: npm test -- --exclude test/graphs.test.ts --grep graph-loading --invert

'@langchain/langgraph':
  node: '>=22.15.0'
  peerDependencies:
    - '@langchain/core@^1'
    - langchain@1.0.1
  versions:
    include: '>=1.0.0 <2'
    mode: max-5
  commands: npm test
