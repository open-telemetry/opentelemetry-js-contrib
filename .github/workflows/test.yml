name: Test Packages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the same Node.js version used for `release-please` workflow.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      # Note: when pushing to main we want to test only what changed in
      # last commit. Otherwise we want to test all changes from origin/main.
      # So we set the right values for base and head commits depending
      # on the type of event (PR or push)
      # ref: https://nx.dev/ci/features/affected#configure-affected-on-ci
      - name: Set base and head commits
        run: |
          if [ "${{github.event_name}}" == "push" ]; then
            echo "NX_BASE=origin/main~1" >> "$GITHUB_ENV"
            echo "NX_HEAD=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Compile (Delta)
        run: npm run compile:ci:affected
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-cache-${{ github.run_number }}
          path: .nx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify-pack:
    # Unit tests run against TS source via ts-node, so they never exercise
    # the published dist/ artifact. This job packs every workspace package,
    # loads every exports/imports target from the tarball, checks condition
    # order and fallbacks, and rejects declarations that still name #platform.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the same Node.js version used for `release-please` workflow.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      # Note: see comment in the compile job
      - name: Set base and head commits
        run: |
          if [ "${{github.event_name}}" == "push" ]; then
            echo "NX_BASE=origin/main~1" >> "$GITHUB_ENV"
            echo "NX_HEAD=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Compile
        run: npm run compile
      - name: Verify packed artifacts
        run: npm run verify-pack

  unit-test:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.15.0"
          - "22"
          - "24"
          - "26"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Although compilation is done in a previous step the toolkit requires
      # a compatible Node.js version even to restore the cached results
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compile-cache-${{ github.run_number }}
          path: .nx
      # Note: see comment in the compile job
      - name: Set base and head commits
        run: |
          if [ "${{github.event_name}}" == "push" ]; then
            echo "NX_BASE=origin/main~1" >> "$GITHUB_ENV"
            echo "NX_HEAD=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Compile (Delta)
        run: npm run compile:ci:affected
      # Switch to the matrix Node.js version so tests exercise every supported runtime.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      # Post install scripts & builds are required for some deps for successful test
      # runs: sqlite3, better-sqlite3, and possibly esbuild.
      - name: Rebuild deps
        run: npm rebuild
      - name: Unit tests (Browser - Delta)
        if: ${{ matrix.node == '24' }}
        run: npm run test:browser:ci:affected
      - name: Start Test Services (Delta)
        run: npm run test-services:start:affected
      - name: Unit tests (Nodejs - Delta)
        run: npm run test:ci:affected
      - name: Stop Test Services (Delta)
        if: always()
        run: npm run test-services:stop

  test-all-versions:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 24
      - run: npm ci --ignore-scripts
        timeout-minutes: 10
      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compile-cache-${{ github.run_number }}
          path: .nx
      # Note: see comment in the compile job
      - name: Set base and head commits
        run: |
          if [ "${{github.event_name}}" == "push" ]; then
            echo "NX_BASE=origin/main~1" >> "$GITHUB_ENV"
            echo "NX_HEAD=origin/main" >> "$GITHUB_ENV"
          else
            echo "NX_BASE=origin/main" >> "$GITHUB_ENV"
            echo "NX_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
      - name: Compile (Delta)
        run: npm run compile:ci:affected
      # Switch to the matrix Node.js version so tests exercise every supported runtime.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      # Post install scripts & builds are required for some deps for successful test
      # runs: sqlite3, better-sqlite3, and possibly esbuild.
      - name: Rebuild deps
        run: npm rebuild
      - name: Start Test Services (Delta)
        run: npm run test-services:start:affected
      - name: Test All Versions (Delta)
        run: npm run test-all-versions:ci:affected
      - name: Stop Test Services (Delta)
        if: always()
        run: npm run test-services:stop
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-coverage-cache-${{ github.run_number }}-${{ matrix.node }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            !node_modules
            packages/*/.nyc_output/**
            LICENSE

  coverage-report:
    needs: test-all-versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10

      # Note: Keep these in sync with the node versions from `test-all-versions` job.
      - name: Download Test Artifacts (22)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-coverage-cache-${{ github.run_number }}-22
          path: .
      - name: Download Test Artifacts (24)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-coverage-cache-${{ github.run_number }}-24
          path: .
      - name: Download Test Artifacts (26)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-coverage-cache-${{ github.run_number }}-26
          path: .

      - name: Report Coverage with Flags
        run: node ./scripts/codecov-upload-flags.mjs
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH_NAME: ${{ github.event.pull_request.head.label }}
