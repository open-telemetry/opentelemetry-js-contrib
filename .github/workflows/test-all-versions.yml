name: Test All Versions
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      npm-workspace-args:
        type: string
  workflow_call:
    inputs:
      npm-workspace-args:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-cache:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_UNSAFE_PERM: true
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the same Node.js version used for `release-please` workflow.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      - name: Build
        run: npm run compile
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tav-build-cache-${{ github.run_number }}
          path: .nx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  tav:
    name: Run test-all-versions
    needs: build-and-cache
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Although compilation is done in a previous step the toolkit requires
      # a compatible Node.js version even to restore the cached results
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install
        run: npm ci --ignore-scripts
        timeout-minutes: 10
      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tav-build-cache-${{ github.run_number }}
          path: .nx
      - name: Build
        run: npm run compile
      # Switch to the matrix Node.js version so tests exercise every supported runtime.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      # Post install scripts & builds are required for some deps for successful test
      # runs: sqlite3, better-sqlite3, and possibly esbuild.
      - name: Rebuild deps
        run: npm rebuild
      - name: Start Test Services
        run: npm run test-services:start
      - name: Run test-all-versions
        run: npm run --if-present --workspaces test-all-versions ${INPUTS_NPM_WORKSPACE_ARGS}
        env:
          INPUTS_NPM_WORKSPACE_ARGS: ${{ inputs.npm-workspace-args }}
          # `tav` resolves the versions under test straight from the registry, so it
          # will often pick up releases that are younger than the `min-release-age`
          # from `.npmrc`, which `npm install` then refuses to install.
          NPM_CONFIG_MIN_RELEASE_AGE: 0
      - name: Stop Test Services
        if: always()
        run: npm run test-services:stop

